name: Copy and Convert Files to Base64

on: [push]

jobs:
  convert_files:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Base64 Encoded Files
        run: |
          # Configure file type (e.g., .json, .png, .txt)
          FILE_TYPE="*.lua"
          OUTPUT_DIR="base64_encoded"
          
          # Create output directory
          mkdir -p "$OUTPUT_DIR"
          
          # Find files, loop, convert to base64 without wrapping, and save
          find . -name "$FILE_TYPE" -type f -not -path "*/.*" | while read file; do
            filename=$(basename "$file")
            echo "Converting $filename..."
            base64 -w 0 "$file" | tr '+/' '-_' | tr -d '=' > "$OUTPUT_DIR/$filename.b64"
            # base64 -w 0 "$file" > "$OUTPUT_DIR/$filename.b64"
          done

      - name: Archive Encoded Files
        uses: actions/upload-artifact@v4
        with:
          name: encoded-files
          path: base64_encoded/

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          git add base64_encoded/
          # Only commit if there are changes to avoid workflow errors
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: auto-generate base64 encoded files"
            git push
          fi